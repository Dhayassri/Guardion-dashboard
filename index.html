<!DOCTYPE html>
<html>
<head>
    <title>Guardion Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  

    <h1>GUARDION Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>Voltage</h2>
            <p id="voltage">228 V</p>
        </div>

        <div class="card">
            <h2>Current</h2>
            <p id="current">4.5 A</p>
        </div>

        <div class="card">
            <h2>Power</h2>
            <p id="power">1026 W</p>
        </div>

        <div class="card">
            <h2>Temperature</h2>
            <p id="temp">35 °C</p>
        </div>

    </div>
    <div class="status-card">
    <h2>System Status</h2>
    <h1 id="status">🟢 NORMAL</h1>
</div>
<div class="status-card">
    <h2>Fault Prediction</h2>

    <p>Normal : 98%</p>
    <p>Peak Load : 1%</p>
    <p>Voltage Drop : 0.5%</p>
    <p>Phase Imbalance : 0.3%</p>
    <p>Overheating : 0.2%</p>

</div>

<script src="script.js"></script>
</body>
</html>
